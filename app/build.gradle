plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // v1.3.0 History: Room butuh annotation processing — KAPT
    // (bukan KSP2, yang butuh Kotlin 2.x; KGP di sini tetap 1.9.25).
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.daftech.clipku'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daftech.clipku'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '1.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables { useSupportLibrary = true }
        ndk {
            // HP Putra (Redmi Note 10S) = arm64. Batasi ABI biar APK ramping.
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        tetap {
            storeFile rootProject.file('signing/clipku-tetap.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // TANPA suffix .debug supaya package tetap com.daftech.clipku.
            // Kunci tetap dipakai kalau file keystore hasil decode secret ada (CI);
            // lokal tanpa file itu jatuh ke debug keystore bawaan.
            if (rootProject.file('signing/clipku-tetap.keystore').exists()) {
                signingConfig signingConfigs.tetap
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.15' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    def composeBom = '2024.06.00'
    // v1.3.0 (#5): media3 1.4.1 -> 1.9.0. fix1 (2026-11-07): 1.11.1
    // GAGAL di checkDebugAarMetadata — AAR 1.10.0+ menuntut
    // minCompileSdk=36 (terverifikasi dari aar-metadata.properties
    // resmi Google Maven), sementara AGP 8.7.3 mentok compileSdk 35.
    // 1.9.0 = versi TERBARU dengan minCompileSdk=35. InAppMp4Muxer
    // jadi muxer default sejak 1.9.0 — tidak ada perubahan code
    // Transformer yang dipaksa API ini.
    def media3Version = '1.9.0'
    def roomVersion = '2.8.5'
    implementation platform("androidx.compose:compose-bom:$composeBom")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // v1.3.0 (#5): media3 1.9.0 (compileSdk 35 + AGP 8.7.3).
    // fix1: 1.11.1 -> 1.9.0 (minCompileSdk 36 vs 35, lihat atas).
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"

    // v1.3.0 History: Room 2.8.5 (stabil 9 Sep 2026) via KAPT.
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"

    // HTTP Innertube + Groq. org.json bawaan Android dipakai untuk JSON
    // (tanpa Gson/Moshi, supaya dependensi tetap sedikit).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // v1.0.2: NewPipeExtractor via JitPack — mesin stream utama yang
    // men-decipher signature YouTube (Innertube WEB/ANDROID sering
    // hanya mengembalikan signatureCipher). Versi v0.26.5 = tag rilis
    // TeamNewPipe yang terverifikasi 2026-11-05 (release GitHub +
    // javadoc: AudioStream.getAudioLocale/getAudioTrackType/
    // getAudioTrackName + StreamExtractor.getLanguageInfo()).
    // v1.0.5 BUTUH v0.26.5: API track audio itu yang dipakai picker
    // sadar-bahasa (NewPipeStreamExtractor) — di v0.26.4 field-field
    // itu belum tentu terisi andal untuk video multi-audio.
    // JitPack adalah satu-satunya jalur distribusi resmi
    // NewPipeExtractor (tidak ada di Maven Central) — kalau JitPack
    // gagal build tag ini di Actions, itulah titik merah pertama yang
    // harus diperiksa.
    // Lisensi GPL-3.0: source ClipKu sudah publik di GitHub, pemakaian
    // pribadi aman; evaluasi ulang kalau suatu hari dijual tertutup.
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
