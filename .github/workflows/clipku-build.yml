name: ClipKu Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang keystore TETAP dari secret KEYSTORE_B64 (pola workspace)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Secret KEYSTORE_B64 belum diset - build dibatalkan supaya signature tidak acak lagi"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > signing/clipku-tetap.keystore
          test -s signing/clipku-tetap.keystore
          ls -l signing/clipku-tetap.keystore
          FP=$(keytool -list -v -keystore signing/clipku-tetap.keystore -storepass android -alias androiddebugkey | grep -i "SHA256:" | head -1 | awk '{print $2}')
          echo "Fingerprint keystore terpasang: $FP"
          if [ "$FP" != "0A:A5:2A:F9:10:17:42:AE:5D:5A:13:80:F7:F2:E8:A4:F1:F5:88:03:80:6F:B6:09:43:72:D3:3C:78:10:30:20" ]; then
            echo "ERROR GERBANG KEYSTORE: fingerprint tidak cocok dengan kunci tetap Putra - build dibatalkan"
            exit 1
          fi
          echo "GERBANG KEYSTORE LOLOS"
          # Sengaja TIDAK mengandalkan plant ~/.android/debug.keystore:
          # build.gradle memakai signing/clipku-tetap.keystore secara eksplisit
          # kalau file itu ada (pola workspace SuaraKu v1.0.2).

      - name: Set up Android SDK (manual cmdline-tools, NO setup-android (broken))
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          # v1.4.0 (P1-9): -f (gagal kalau HTTP error, bukan simpan
          # halaman error sebagai zip) + --retry 3 + cek ukuran file
          # sebelum unzip — flake download Gradle v1.0.5 jangan terulang.
          curl -f -sL --retry 3 -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          test -s cmdtools.zip
          unzip -q -o cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9 (AGP 8.7.3 butuh min Gradle 8.9)
        run: |
          set -e
          cd /tmp
          # v1.4.0 (P1-9): sama seperti step SDK — -f + --retry 3 +
          # cek ukuran sebelum unzip.
          curl -f -sL --retry 3 -o gradle-8.9-bin.zip "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          test -s gradle-8.9-bin.zip
          unzip -q -o gradle-8.9-bin.zip
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.9/bin/gradle --version | head -n 5

      - name: Unit test (v1.4.0 P2-9 — gagal test = build merah)
        run: |
          set -e
          gradle testDebugUnitTest 2>&1 | tee test.log
          ls app/build/test-results/testDebugUnitTest/ || true

      - name: Build debug APK (log ke build.log)
        run: |
          set -e
          gradle assembleDebug 2>&1 | tee build.log
          ls -lh app/build/outputs/apk/debug/
          V=$(grep -oP "versionName '\\K[^']+" app/build.gradle | head -1)
          echo "Versi dari build.gradle: $V"
          cp app/build/outputs/apk/debug/app-debug.apk "ClipKu-v${V}.apk"
          ls -lh "ClipKu-v${V}.apk" build.log

      - name: Gerbang sertifikat APK (wajib == kunci tetap)
        run: |
          set -e
          APKSIGNER=$(ls "$HOME/android-sdk/build-tools/"*/apksigner | head -1)
          CERT=$("$APKSIGNER" verify --print-certs ClipKu-v*.apk | grep "SHA-256 digest" | awk '{print $NF}')
          echo "SHA-256 sertifikat APK: $CERT"
          if [ "$CERT" != "0aa52af9101742ae5d5a1380f7f2e8a4f1f58803806fb6094372d33c78103020" ]; then
            echo "ERROR GERBANG SERTIFIKAT: APK tidak ditandatangani kunci tetap - release dibatalkan"
            exit 1
          fi
          echo "GERBANG SERTIFIKAT LOLOS"

      - name: Upload build.log (SELALU, walau build gagal)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            gh release view build-log > /dev/null 2>&1 || gh release create build-log --title "build-log" --notes "Build logs - ClipKu"
            gh release upload build-log build.log --clobber
            echo "build.log uploaded"
          else
            echo "build.log tidak ada (gagal sangat awal)"
          fi

      - name: Upload APK ke rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "latest" --notes "Rolling latest build - ClipKu"
          V=$(grep -oP "versionName '\\K[^']+" app/build.gradle | head -1)
          gh release upload latest "ClipKu-v${V}.apk" --clobber
          echo "UPLOAD OK"
